<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Twitch Chat Logger</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 60px auto; }
  button { font-size: 18px; padding: 10px 28px; margin-right: 10px; cursor: pointer; }
  #start { background: #2e7d32; color: white; border: none; border-radius: 6px; }
  #stop  { background: #c62828; color: white; border: none; border-radius: 6px; }
  #status { margin: 16px 0 4px; color: #555; }
  #count  { margin: 0 0 16px; color: #888; font-size: 14px; }
  textarea { width: 100%; height: 160px; font-size: 15px; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
  <h2>Twitch Chat Logger</h2>
  <p>Stream: <b id="channel">...</b></p>

  <button id="start" onclick="send('/start')">Start</button>
  <button id="stop" onclick="send('/stop')">Stop</button>

  <p id="status">Not listening.</p>
  <p id="count"></p>

  <!-- ===== TEXT BOX: change the text between the tags to whatever you want ===== -->
  <textarea id="textbox">Press Start to begin logging the Twitch chat.
Press Stop to save every message from the start-stop window to a .txt file.</textarea>

<script>
  // Tell the backend to start or stop, then show its reply
  async function send(path) {
    const res = await fetch(path, { method: "POST" });
    document.getElementById("status").textContent = (await res.json()).status;
  }

  // Ask the backend how things are going, once a second
  async function refreshStatus() {
    try {
      const s = await (await fetch("/status")).json();
      document.getElementById("channel").textContent = "twitch.tv/" + s.channel;
      document.getElementById("count").textContent = !s.listening ? "" :
        (s.connected ? "Connected - " : "Connecting... ") + s.count + " messages so far";
    } catch {
      document.getElementById("count").textContent = "Backend not running?";
    }
  }
  refreshStatus();
  setInterval(refreshStatus, 1000);
</script>
</body>
</html>
