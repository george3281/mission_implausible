<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Twitch Chat Logger</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 60px auto; }
  button { font-size: 18px; padding: 10px 28px; margin-right: 10px; cursor: pointer; }
  #start { background: #2e7d32; color: white; border: none; border-radius: 6px; }
  #stop  { background: #c62828; color: white; border: none; border-radius: 6px; }
  #status { margin: 16px 0 4px; color: #555; }
  #count  { margin: 0 0 16px; color: #888; font-size: 14px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px 14px; margin: 10px 0; font-size: 20px; }
  .card small { display: block; margin-top: 8px; color: #777; font-size: 13px; }
  #error { color: #c62828; margin-top: 12px; }
</style>
</head>
<body>
  <h2>Twitch Chat Logger</h2>
  <p>Stream: <b id="channel">...</b></p>

  <button id="start" onclick="send('/start')">Start</button>
  <button id="stop" onclick="send('/stop')">Stop</button>

  <p id="status">Not listening.</p>
  <p id="count"></p>

  <!-- The 3 AI-selected cards appear here after Stop -->
  <div id="cards"></div>
  <div id="error"></div>

<script>
  // Tell the backend to start or stop, then show its reply (and the cards after Stop)
  async function send(path) {
    const cardsBox = document.getElementById("cards");
    const errorBox = document.getElementById("error");
    errorBox.textContent = "";
    if (path === "/stop") {
      document.getElementById("status").textContent = "AI is thinking...";
      cardsBox.textContent = "";
    }
    try {
      const res = await fetch(path, { method: "POST" });
      const data = await res.json();
      document.getElementById("status").textContent = data.status;
      if (data.error) errorBox.textContent = data.error;
      if (data.cards) showCards(data.cards);
    } catch (e) {
      document.getElementById("status").textContent = "Could not reach the backend.";
    }
  }

  // textContent (not innerHTML), so chat text can never inject code into the page
  function showCards(cards) {
    const box = document.getElementById("cards");
    box.textContent = "";
    cards.forEach((c) => {
      const div = document.createElement("div");
      div.className = "card";
      div.textContent = c.text;
      const src = document.createElement("small");
      src.textContent = c.chat && c.chat.length ? "From chat: " + c.chat[0] : "Invented by the AI";
      div.appendChild(src);
      box.appendChild(div);
    });
  }

  // Ask the backend how things are going, once a second
  async function refreshStatus() {
    try {
      const s = await (await fetch("/status")).json();
      document.getElementById("channel").textContent = "twitch.tv/" + s.channel;
      document.getElementById("count").textContent = !s.listening ? "" :
        (s.connected ? "Connected - " : "Connecting... ") + s.count + " messages so far";
    } catch {
      document.getElementById("count").textContent = "Backend not running?";
    }
  }
  refreshStatus();
  setInterval(refreshStatus, 1000);
</script>
</body>
</html>
